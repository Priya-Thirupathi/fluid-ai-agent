[project]
name = "fluid-ai-agent"
version = "0.1.0"
description = "Autonomous agent that plans, writes and reviews business documents as .docx"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
